name: Importar eMule Community 0.72a y validar mejora

on:
  push:
    branches: [main, fix/partfile-safety-2026-11-04]
    paths:
      - '.github/workflows/bootstrap-emule.yml'
      - 'srchybrid/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-emule.yml'
      - 'srchybrid/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Descargar fuentes originales y verificar SHA256
        shell: bash
        run: |
          set -euo pipefail
          if test -f srchybrid/SearchListCtrl.cpp; then
            echo "El codigo ya esta importado. No se sobrescribira."
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/emule_sources"
          curl -fL --retry 3 --output "$RUNNER_TEMP/eMule0.72a-Sources.zip" \
            "https://github.com/irwir/eMule/releases/download/eMule_v0.72a-community/eMule0.72a-Sources.zip"
          echo "7457d2b9b11c7800b79f29579854492ab04888ec55c37d78494cf7900f100f9a  $RUNNER_TEMP/eMule0.72a-Sources.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/eMule0.72a-Sources.zip" -d "$RUNNER_TEMP/emule_sources"

          entry="$(find "$RUNNER_TEMP/emule_sources" -type f -path '*/srchybrid/SearchListCtrl.cpp' -print -quit)"
          test -n "$entry"
          source_root="${entry%/srchybrid/SearchListCtrl.cpp}"
          test -f "$source_root/srchybrid/emule.sln"
          echo "Fuentes extraidas desde: $source_root"
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/scripts/' --exclude='/README.md' \
            "$source_root/" "$GITHUB_WORKSPACE/"

          python3 scripts/apply_download_to_folder.py
          python3 scripts/apply_download_to_folder.py

          cat > UPSTREAM_SOURCE.txt <<'EOF'
          Fuente: eMule Community 0.72a
          Repositorio: https://github.com/irwir/eMule
          Tag: eMule_v0.72a-community
          Commit: ac3d52eafd88e9f6d9e0c2204c6dbead18db750b
          Asset: eMule0.72a-Sources.zip
          SHA256: 7457d2b9b11c7800b79f29579854492ab04888ec55c37d78494cf7900f100f9a
          Cambio: Descargar en... (seleccion multiple, categoria automatica persistente)
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: importar eMule Community 0.72a con Descargar en"
            git push origin HEAD:main
          fi

  compile-windows-x64:
    needs: import
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Obtener dependencias C++ con commits fijados
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Get-Dependency([string]$name, [string]$branch, [string]$expected, [string]$relative, [string]$target) {
            $work = Join-Path $env:RUNNER_TEMP ("dep-" + $name)
            git clone --quiet --depth 1 --branch $branch ("https://github.com/emulebb/emulebb-" + $name + ".git") $work
            if ($LASTEXITCODE -ne 0) { throw "Error descargando $name" }
            if ($name -eq "mbedtls") {
              git -C $work submodule update --init --recursive --depth 1
              if ($LASTEXITCODE -ne 0) { throw "Error descargando submodulos de MbedTLS" }
            }
            if ($LASTEXITCODE -ne 0) { throw "Error descargando $name" }
            $commit = (git -C $work rev-parse HEAD).Trim()
            if ($commit -ne $expected) { throw "SHA no coincide para $name; esperaba $expected y obtuvo $commit" }
            $source = if ($relative -eq ".") { $work } else { Join-Path $work $relative }
            if (-not (Test-Path $source)) { throw "Ruta de dependencia inexistente: $source" }
            $dest = Join-Path $env:GITHUB_WORKSPACE $target
            if (Test-Path $dest) { throw "Destino de dependencia ya presente: $dest" }
            Copy-Item -LiteralPath $source -Destination $dest -Recurse -Force
            Write-Host "$name $commit verificado"
          }
          Get-Dependency "cryptopp" "CRYPTOPP_8_4_0-pristine" "5279c7a811a97b574a839ea89b4c30ad337e6675" "." "cryptopp"
          Get-Dependency "id3lib" "id3lib-v3.9.1-emule" "fc66770df4ec3309fb4acb2ea570bf940f5c96eb" "." "id3lib"
          Get-Dependency "miniupnp" "miniupnpc-master-emule" "4e7a10948004ca2085ac8103e14fc77edb898b4c" "miniupnpc" "miniupnpc"
          Get-Dependency "resizablelib" "ResizableLib-bebab50-emule" "a7b01a31296b7fe2ed3331171e126ebd9cb1652a" "ResizableLib" "ResizableLib"
          Get-Dependency "zlib" "zlib-v1.3.2-emule" "31fd978c8b2cf375b3935a8279bc599cc07e2a6a" "." "zlib"
          Get-Dependency "mbedtls" "mbedtls-v4.1.0-emule" "4f8ce00444e273babc61d647639e180e5aed56f2" "." "mbedtls"
          # id3lib vendorizado en emulebb resuelve zlib como emulebb-zlib;
          # este proyecto conserva los nombres de carpetas de la solucion oficial.
          $project = Join-Path $env:GITHUB_WORKSPACE "id3lib\libprj\id3lib.vcxproj"
          $xml = [IO.File]::ReadAllText($project)
          if (-not $xml.Contains("emulebb-zlib")) { throw "No coincide el ancla de id3lib" }
          [IO.File]::WriteAllText($project, $xml.Replace("emulebb-zlib", "zlib"))

      - name: Fijar Python para Mbed TLS
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64

      - name: Instalar y verificar generador Python de Mbed TLS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -c "import sys; print('python:', sys.executable)"
          python3 -c "import sys; print('python3:', sys.executable)"
          python3 -m pip install --disable-pip-version-check "jsonschema==4.25.1" "jinja2==3.1.6"
          if ($LASTEXITCODE -ne 0) { throw "No se pudo instalar jsonschema en python3" }
          python3 -c "import jsonschema, jinja2; print('jsonschema y jinja2 disponibles')"
          if ($LASTEXITCODE -ne 0) { throw "jsonschema no esta disponible en python3" }

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Compilar Release x64
        shell: pwsh
        run: |
          if (-not (Test-Path "srchybrid/emule.sln")) { throw "No se importaron las fuentes" }
          msbuild "srchybrid/emule.sln" /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /v:minimal /bl:compilacion.binlog
          if ($LASTEXITCODE -ne 0) { throw "MSBuild error $LASTEXITCODE" }
      - name: Preparar ZIP portable Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'srchybrid/x64/Release/emule.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "No se generó emule.exe en $exe" }
          $dir = Join-Path $env:RUNNER_TEMP 'nuevo-emule-portable'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item -LiteralPath $exe -Destination (Join-Path $dir 'emule.exe')
          @'
          eMule Community 0.72a - compilación experimental del repositorio nuevo-emule.
          Extraer y ejecutar emule.exe. Sin instalador.
          IMPORTANTE: sin pruebas funcionales sobre una cola real.
          Antes de usar con descargas existentes, conservar una copia de seguridad
          de config, Temp, archivos .part y .part.met.
          '@ | Set-Content -LiteralPath (Join-Path $dir 'LEEME.txt') -Encoding utf8
          $zip = Join-Path $env:GITHUB_WORKSPACE 'nuevo-emule-portable-windows-x64.zip'
          Compress-Archive -LiteralPath (Join-Path $dir 'emule.exe'),(Join-Path $dir 'LEEME.txt') -DestinationPath $zip -Force
          Get-FileHash -Algorithm SHA256 $zip | Format-List
          if (-not (Test-Path -LiteralPath $zip)) { throw "ZIP no generado" }
      - name: Publicar ZIP como prerelease de pruebas sin usar almacenamiento de Actions
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $short = $env:GITHUB_SHA.Substring(0,12)
          $tag = "portable-test-$short"
          $zip = Join-Path $env:GITHUB_WORKSPACE 'nuevo-emule-portable-windows-x64.zip'
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $zip --title "Prueba portable x64 $short" --notes "Versión experimental. Compilada, sin validación funcional con descargas reales. Hacer copia de seguridad de .part, .part.met y config antes de usar." --prerelease --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw "No se pudo publicar el ZIP portable" }
